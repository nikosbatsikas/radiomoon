<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RadioMoon</title>
<style>
:root{--bg:#14161c;--panel:#1d2029;--panel2:#252936;--line:#323748;--text:#e6e8ef;--dim:#8d93a6;--acc:#f0a23a;--ok:#46c07a;--bad:#e5534b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;color:var(--acc)}
header .sp{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
button.danger:hover{border-color:var(--bad)}
input[type=text],input[type=search],select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;min-width:0}
main{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;padding:12px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
#now .t{font-size:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#now .time{color:var(--dim);margin:2px 0 8px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.row label{color:var(--dim)}
input[type=range]{flex:1;min-width:100px;accent-color:var(--acc)}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.it{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it.cur{background:#3a2f1a}
.it .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
.it button{padding:3px 8px}
.k{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#status{color:var(--dim);font-size:12px;margin-top:8px;min-height:1.4em}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:6px}
.pad button{white-space:normal;min-height:46px;font-size:12px}
.badge{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.badge.live{background:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#login-note{display:none}
</style>
</head>
<body>
<header>
  <h1 id="station">RadioMoon</h1>
  <span class="badge" id="ver"></span>
  <span class="badge" id="clock"></span>
  <span class="badge live" id="livebadge" style="display:none">LIVE</span>
  <span class="sp"></span>
  <button id="m-auto" data-t="Auto">Auto</button>
  <button id="m-manual" data-t="Manual">Manual</button>
  <button id="m-offline" data-t="Offline">Offline</button>
  <select id="lang"><option value="en">English</option><option value="el">Ελληνικά</option></select>
</header>
<main>
  <section>
    <div class="card" id="now">
      <h2 data-t="On air">On air</h2>
      <div class="t" id="nt">-</div>
      <div class="time"><span id="el">0:00</span> / <span id="du">0:00</span></div>
      <div class="bar"><i id="pg"></i></div>
      <div class="row">
        <button id="b-restart" data-t="Restart">Restart</button>
        <button id="b-pause" data-t="Pause">Pause</button>
        <button id="b-next" data-t="Next">Next</button>
        <button id="b-stop" class="danger" data-t="Stop">Stop</button>
        <button id="b-loop" data-t="Loop">Loop</button>
        <button id="b-stopnext" data-t="Stop after track">Stop after track</button>
        <button id="b-live" data-t="Live">Live</button>
      </div>
      <div class="row"><label data-t="Volume">Volume</label><input type="range" id="vol" min="0" max="150" value="100"><span id="vv">100%</span></div>
      <div id="status"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2 data-t="Playlist">Playlist</h2>
      <div class="list" id="log"></div>
      <div class="row">
        <button id="b-regen" data-t="Rebuild automatic">Rebuild automatic</button>
        <button id="b-clear" class="danger" data-t="Clear playlist">Clear playlist</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2 data-t="Instant jingles">Instant jingles</h2>
      <div class="tabs" id="ptabs"></div>
      <div class="pad" id="pad"></div>
      <div class="row"><button id="b-sj" data-t="Stop jingles">Stop jingles</button></div>
    </div>
  </section>
  <section>
    <div class="card">
      <h2 data-t="Library">Library</h2>
      <div class="row" style="margin-top:0">
        <input type="search" id="q" placeholder="Search" style="flex:1">
        <select id="kind"></select>
      </div>
      <div class="list" id="lib" style="margin-top:8px"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2 data-t="Played">Played</h2>
      <div class="list" id="hist"></div>
    </div>
  </section>
</main>
<script>
const EL={"Auto":"Αυτόματο","Manual":"Χειροκίνητο","Offline":"Εκτός","On air":"Στον αέρα","Restart":"Επανεκκίνηση","Pause":"Παύση","Next":"Επόμενο","Stop":"Στοπ","Loop":"Επανάληψη","Stop after track":"Στοπ μετά το κομμάτι","Live":"Ζωντανά","Volume":"Ένταση","Playlist":"Λίστα","Rebuild automatic":"Νέο αυτόματο πρόγραμμα","Clear playlist":"Καθαρισμός λίστας","Instant jingles":"Άμεσα jingles","Stop jingles":"Στοπ jingles","Library":"Βιβλιοθήκη","Played":"Παίχτηκαν","Search":"Αναζήτηση","Add":"Προσθήκη","Next up":"Επόμενο","Play":"Παίξε","Remove":"Αφαίρεση","Nothing is playing":"Δεν παίζει τίποτα","music":"Μουσική","jingle":"Jingle","sweeper":"Sweeper","voice":"Voice","spot":"Διαφήμιση","break":"Διάλειμμα","memo":"Σημείωση"};
let lang='en',S={},cur=null,pal=[],pidx=0,lastFetch=0;
const $=id=>document.getElementById(id);
const T=s=>lang==='el'&&EL[s]?EL[s]:s;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fm(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));$('q').placeholder=T('Search');document.documentElement.lang=lang;renderKinds();}
async function api(path,body){
  const o=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
  const r=await fetch(path,o);return r.json();
}
async function act(o){S=await api('/api/action',o);render();}
function render(){
  $('station').textContent=S.station||'RadioMoon';$('ver').textContent='v'+S.version;
  if(S.lang&&!window._langSet){lang=S.lang;$('lang').value=lang;window._langSet=1;applyLang();}
  const n=S.now;$('nt').textContent=n?n.label:T('Nothing is playing');
  $('du').textContent=n?fm(n.dur):'0:00';$('el').textContent=fm(S.elapsed||0);
  $('pg').style.width=(n&&n.dur?Math.min(100,100*S.elapsed/n.dur):0)+'%';
  $('b-pause').classList.toggle('on',!!S.paused);$('b-loop').classList.toggle('on',!!S.loop);
  $('b-stopnext').classList.toggle('on',!!S.stopnext);$('b-live').classList.toggle('on',!!S.live);
  $('livebadge').style.display=S.live?'':'none';
  for(const m of['auto','manual','offline'])$('m-'+m).classList.toggle('on',S.mode===m);
  if(document.activeElement!==$('vol')){$('vol').value=Math.round(S.volume*100);$('vv').textContent=Math.round(S.volume*100)+'%';}
  $('status').textContent=S.status||'';
  $('log').innerHTML=(S.log||[]).map(t=>`<div class="it ${t.i===S.current?'cur':''}"><span class="m">${esc(t.start)}</span><span class="n" title="${esc(t.label)}">${esc(t.label)}</span><span class="k">${esc(T(t.kind))}</span><span class="m">${esc(t.durs)}</span>`+
   `<button data-a="play" data-i="${t.i}" title="${T('Play')}">▶</button><button data-a="up" data-i="${t.i}">↑</button><button data-a="down" data-i="${t.i}">↓</button><button data-a="remove" data-i="${t.i}" title="${T('Remove')}">✕</button></div>`).join('');
  $('hist').innerHTML=(S.history||[]).map(h=>`<div class="it"><span class="m">${esc(h.time)}</span><span class="n">${esc(h.label)}</span></div>`).join('');
}
$('log').onclick=e=>{const b=e.target.closest('button');if(!b)return;act({do:b.dataset.a,index:+b.dataset.i});};
const simple={'b-restart':'restart','b-pause':'pause','b-next':'next','b-stop':'stop','b-loop':'loop','b-stopnext':'stopnext','b-live':'live','b-regen':'regen','b-sj':'stopjingles'};
for(const k in simple)$(k).onclick=()=>act({do:simple[k]});
$('b-clear').onclick=()=>{if(confirm('?'))act({do:'clear'});};
for(const m of['auto','manual','offline'])$('m-'+m).onclick=()=>act({do:'mode',mode:m});
$('vol').oninput=()=>{$('vv').textContent=$('vol').value+'%';};
$('vol').onchange=()=>act({do:'volume',value:$('vol').value/100});
$('lang').onchange=()=>{lang=$('lang').value;applyLang();render();loadLib();renderPad();};
let kinds=[],kind='music',qt=null;
function renderKinds(){const s=$('kind');const v=kind;s.innerHTML=(kinds.length?kinds:['music']).map(k=>`<option value="${esc(k)}">${esc(T(k))}</option>`).join('');s.value=v;}
$('kind').onchange=()=>{kind=$('kind').value;loadLib();};
$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(loadLib,250);};
async function loadLib(){
  const r=await api('/api/library?kind='+encodeURIComponent(kind)+'&q='+encodeURIComponent($('q').value)+'&limit=150');
  if(r.kinds&&r.kinds.join()!==kinds.join()){kinds=r.kinds;renderKinds();}
  $('lib').innerHTML=r.items.map(t=>`<div class="it"><span class="n" title="${esc(t.label)}">${esc(t.label)}</span><span class="m">${esc(t.durs)}</span><button data-w="next" data-id="${t.id}">${T('Next up')}</button><button data-w="end" data-id="${t.id}">${T('Add')}</button></div>`).join('');
}
$('lib').onclick=e=>{const b=e.target.closest('button');if(!b)return;act({do:'add',id:+b.dataset.id,where:b.dataset.w});};
async function loadPal(){const r=await api('/api/pallets');pal=r.pallets||[];renderPad();}
function renderPad(){
  $('ptabs').innerHTML=pal.map((p,i)=>`<button class="${i===pidx?'on':''}" data-p="${i}">${esc(p.name)}</button>`).join('');
  const p=pal[pidx];$('pad').innerHTML=p?p.buttons.map(b=>{const c=b.color||[60,60,80];return `<button data-id="${b.id}" style="border-left:5px solid rgb(${c[0]},${c[1]},${c[2]})">${esc(b.label)}</button>`}).join(''):'';
}
$('ptabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;pidx=+b.dataset.p;renderPad();};
$('pad').onclick=e=>{const b=e.target.closest('button');if(!b)return;act({do:'jingle',id:+b.dataset.id});};
async function tick(){try{S=await api('/api/state');render();}catch(e){$('status').textContent='offline';}}
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString();},1000);
setInterval(tick,1000);
applyLang();tick().then(()=>{loadLib();loadPal();});
</script>
</body>
</html>
