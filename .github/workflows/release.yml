# Builds every edition when a version tag is pushed (create the release on GitHub: Releases > Draft a new release).
# The packages are attached to that release and its notes are taken from CHANGELOG.md; no release is created here:
#   Windows x64/x86/arm64: setup .exe, portable .zip   (x64 includes the bundled MariaDB)
#   Linux x64/arm64:       .deb, .rpm, portable .tar.gz
#   macOS arm64 (Apple Silicon): .dmg
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download MariaDB (x64 only)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: Invoke-WebRequest "https://archive.mariadb.org/mariadb-11.4.4/winx64-packages/mariadb-11.4.4-winx64.zip" -OutFile mariadb.zip
      - name: Build setup and portable zip
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "x64") { ./build_installer.ps1 -Arch x64 -MariaDbZip "$PWD\mariadb.zip" }
          else { ./build_installer.ps1 -Arch ${{ matrix.arch }} }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build
        shell: bash
        run: |
          set +e
          cargo build --release --message-format=short 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          # compiler errors and warnings as annotations (one line each), so they are easy to read in the run summary
          ERR=$(grep -E ': error' build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          WARN=$(grep -E ': warning' build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          [ -n "$ERR" ] && echo "::error title=Compiler errors::$ERR"
          [ -n "$WARN" ] && echo "::warning title=Compiler warnings::$WARN"
          exit $RC
      - name: Packages
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build
          cargo generate-rpm
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist RadioMoon/lang
          cp target/release/radiomoon RadioMoon/radiomoon
          cp README.md CHANGELOG.md RadioMoon/
          cp lang/* RadioMoon/lang/
          touch RadioMoon/portable.flag
          tar czf dist/RadioMoon-$V-linux-${{ matrix.arch }}-portable.tar.gz RadioMoon
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: App bundle and dmg
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=dist/RadioMoon.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources dist/dmg
          cp target/release/radiomoon $APP/Contents/MacOS/RadioMoon
          sed "s/@VERSION@/$V/g" packaging/macos/Info.plist.in > $APP/Contents/Info.plist
          mkdir RadioMoon.iconset
          for s in 16 32 64 128 256; do sips -z $s $s packaging/icon.png --out RadioMoon.iconset/icon_${s}x${s}.png; done
          iconutil -c icns RadioMoon.iconset -o $APP/Contents/Resources/RadioMoon.icns
          cp -R $APP dist/dmg/
          hdiutil create -volname RadioMoon -srcfolder dist/dmg -ov -format UDZO dist/RadioMoon-$V-macos-${{ matrix.arch }}.dmg
          rm -rf dist/dmg dist/RadioMoon.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  # The headless server (web studio). Built inside old distributions on purpose: AlmaLinux 8 has glibc 2.28, so the one
  # binary runs on Debian 10+, Ubuntu 20.04+, Raspberry Pi OS 64-bit, AlmaLinux / Rocky / RHEL 8+ and Fedora.
  # Alpine uses musl and has its own build.
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x64, flavor: glibc, image: "almalinux:8" }
          - { os: ubuntu-22.04-arm, arch: arm64, flavor: glibc, image: "almalinux:8" }
          - { os: ubuntu-22.04, arch: x64, flavor: alpine, image: "rust:alpine" }
          - { os: ubuntu-22.04-arm, arch: arm64, flavor: alpine, image: "rust:alpine" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build in the container
        run: |
          if [ "${{ matrix.flavor }}" = "glibc" ]; then
            SETUP='dnf install -y gcc gcc-c++ make pkgconf-pkg-config alsa-lib-devel curl perl-core cmake >/dev/null && curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null && . $HOME/.cargo/env'
            FLAGS=''
          else
            SETUP='apk add --no-cache build-base pkgconf alsa-lib-dev perl cmake linux-headers >/dev/null'
            FLAGS='-C target-feature=-crt-static'
          fi
          docker run --rm -v "$PWD":/src -w /src -e RUSTFLAGS="$FLAGS" ${{ matrix.image }} sh -c "$SETUP && cargo build --release --no-default-features --bin radiomoon-server --message-format=short > build.log 2>&1; echo \$? > rc.txt; tail -40 build.log" || true
          ERR=$(grep -E ': error' build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          [ -n "$ERR" ] && echo "::error title=Server compiler errors::$ERR"
          tail -30 build.log
          [ "$(cat rc.txt)" = 0 ] && [ -f target/release/radiomoon-server ] || exit 1
      - name: Package
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          D=RadioMoon-Server
          mkdir -p $D/lang dist
          cp target/release/radiomoon-server $D/
          cp packaging/server/* $D/
          cp lang/* $D/lang/
          cp README.md CHANGELOG.md $D/
          sudo chown -R "$USER" $D 2>/dev/null || true
          tar czf dist/RadioMoon-Server-$V-linux-${{ matrix.flavor }}-${{ matrix.arch }}.tar.gz $D
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.flavor }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [windows, linux, macos, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Check that the tag matches the program version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $V"; exit 1; }
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          awk -v v="$V" '$0 ~ "^## " v "([^0-9.]|$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "RadioMoon $V" > notes.md
          cat notes.md
      - name: Attach the packages to your release and set its notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is created by you on GitHub (Releases > Draft a new release). This step never creates one:
          # it uploads the packages to it and replaces its description with the CHANGELOG.md section.
          TAG="${GITHUB_REF_NAME}"
          for i in $(seq 1 24); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && FOUND=1 && break
            sleep 5
          done
          [ -n "$FOUND" ] || { echo "No release for tag $TAG. Create it on GitHub (Releases > Draft a new release), then re-run this workflow."; exit 1; }
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
